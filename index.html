<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VALORANT Web Game</title>
  <link rel="stylesheet" href="/src/styles.css" />
  <meta property="og:image" content="https://bolt.new/static/og_default.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png">
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <div id="hud">
    <div id="crosshair"></div>

    <div class="controls">
      <h2>VALORANT Web Game</h2>
      <p><strong>W A S D</strong> &mdash; Move</p>
      <p><strong>Mouse</strong> &mdash; Look</p>
      <p><strong>Left Click</strong> &mdash; Shoot</p>
      <p><strong>Q E R F</strong> &mdash; Abilities</p>
      <p><strong>R</strong> &mdash; Reload</p>
      <p><strong>Esc</strong> &mdash; Release Mouse</p>
    </div>

    <div id="playerInfo">
      <h3>Player Status</h3>
      <div class="stat-bar">
        <span class="label">Health</span>
        <span id="healthText" class="value">100/100</span>
        <div class="bar"><div class="bar-fill" id="healthBar"></div></div>
      </div>
      <div class="stat-bar">
        <span class="label">Shield</span>
        <span id="shieldText" class="value">0/50</span>
        <div class="bar"><div class="bar-fill shield" id="shieldBar"></div></div>
      </div>
      <div class="stat-bar">
        <span class="label">Ammo</span>
        <span id="ammoText" class="value">30 / 90</span>
      </div>
      <div class="stat-bar">
        <span class="label">Ultimate</span>
        <span id="ultText" class="value">0/100</span>
        <div class="bar"><div class="bar-fill ult" id="ultBar"></div></div>
      </div>
    </div>

    <div id="abilities">
      <h3>Abilities</h3>
      <div class="ability" id="abilityQ"><span class="key">Q</span> Smoke</div>
      <div class="ability" id="abilityE"><span class="key">E</span> Heal</div>
      <div class="ability" id="abilityR"><span class="key">R</span> Stun</div>
      <div class="ability" id="abilityF"><span class="key">F</span> Ultimate</div>
    </div>

    <div id="radar"><canvas id="radarCanvas" width="200" height="200"></canvas></div>

    <div id="killFeed"></div>
    <div id="debug"></div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
